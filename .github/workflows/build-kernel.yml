name: Build Calamity Kernel Modules

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        run: |
          git clone --depth=1 --branch CALY-Base \
            https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/BruxinCore/CalamityKernel-spacewar.git \
            kernel-source
          cd kernel-source
          git submodule update --init --recursive || true

      - name: Setup Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc flex bison libssl-dev libelf-dev git wget ccache curl python3 cpio lz4 zstd openssl perl unzip zip

      - name: Download Proton Clang Toolchain
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain-clang

      - name: Setup Environment Path
        run: |
          echo "$GITHUB_WORKSPACE/toolchain-clang/bin" >> $GITHUB_PATH

      - name: Compile Kernel Modules
        working-directory: kernel-source
        run: |
          # FIX IZIN EKSEKUSI
          chmod -R +x scripts/
          find . -name "*.sh" -exec chmod +x {} +

          # FIX TRACE HEADERS
          if [ -f kernel/sched/walt/trace.h ]; then
            sed -i 's|#define TRACE_INCLUDE_PATH .|#define TRACE_INCLUDE_PATH ../../kernel/sched/walt|g' kernel/sched/walt/trace.h || true
          fi
          if [ -f kernel/sched/trace.h ]; then
            sed -i 's|#define TRACE_INCLUDE_PATH .|#define TRACE_INCLUDE_PATH ../../kernel/sched|g' kernel/sched/trace.h || true
          fi
          if [ -f drivers/hid/hid-trace.h ]; then
            sed -i 's|#define TRACE_INCLUDE_PATH .|#define TRACE_INCLUDE_PATH ../../drivers/hid|g' drivers/hid/hid-trace.h || true
          fi
          for f in drivers/soc/qcom/*trace.h; do
            if [ -f "$f" ]; then
              sed -i 's|#define TRACE_INCLUDE_PATH .|#define TRACE_INCLUDE_PATH ../../drivers/soc/qcom|g' "$f" || true
            fi
          done

          # FIX STRICT-PROTOTYPES
          sed -i 's/cc-option -Werror=strict-prototypes//g' Makefile || true
          sed -i 's/-Werror=strict-prototypes//g' Makefile || true

          # SET CONFIG JADI MODULE (=m)
          echo "CONFIG_USB_ACM=m" >> arch/arm64/configs/spacewar_defconfig
          echo "CONFIG_USB_SERIAL=m" >> arch/arm64/configs/spacewar_defconfig
          echo "CONFIG_USB_SERIAL_FTDI_SIO=m" >> arch/arm64/configs/spacewar_defconfig
          echo "CONFIG_USB_SERIAL_CH341=m" >> arch/arm64/configs/spacewar_defconfig
          echo "CONFIG_USB_SERIAL_CP210X=m" >> arch/arm64/configs/spacewar_defconfig
          echo "CONFIG_USB_SERIAL_PL2303=m" >> arch/arm64/configs/spacewar_defconfig
          echo "CONFIG_RTL8188EU=m" >> arch/arm64/configs/spacewar_defconfig
          echo "CONFIG_RTL8192EU=m" >> arch/arm64/configs/spacewar_defconfig
          echo "CONFIG_RTL8812AU=m" >> arch/arm64/configs/spacewar_defconfig
          echo "CONFIG_RTL8821CU=m" >> arch/arm64/configs/spacewar_defconfig
          echo "CONFIG_ATH9K_HTC=m" >> arch/arm64/configs/spacewar_defconfig
          echo "CONFIG_MT7601U=m" >> arch/arm64/configs/spacewar_defconfig
          echo "CONFIG_MT76x2U=m" >> arch/arm64/configs/spacewar_defconfig

          # KONFIGURASI
          make ARCH=arm64 SUBARCH=arm64 spacewar_defconfig
          make ARCH=arm64 SUBARCH=arm64 CC=clang olddefconfig

          # BUILD PREPARE
          make ARCH=arm64 SUBARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=0 \
            -j$(nproc) prepare modules_prepare

          # BUILD MODULES (BUKAN IMAGE)
          make ARCH=arm64 SUBARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=0 \
            -j$(nproc) modules 2>&1 | tee build.log

          echo "=== FILE .ko YANG DIHASILKAN ==="
          find . -name "*.ko" -exec ls -la {} \;

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Log
          path: kernel-source/build.log

      - name: Upload Modules (.ko)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Modules
          path: kernel-source/drivers/**/*.ko
          if-no-files-found: warn
