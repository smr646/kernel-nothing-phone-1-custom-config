name: Build Spacewar Kernel + Repack boot.img

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        run: |
          git clone --depth=1 --branch sm7325/v/mr \
            https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/KoraiLabs/Spacewar-nethunter.git \
            kernel-source
          cd kernel-source
          git submodule update --init --recursive || true

      - name: Setup Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc flex bison libssl-dev libelf-dev git wget ccache curl python3 cpio lz4 zstd openssl perl unzip zip

      - name: Download Proton Clang Toolchain
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain-clang

      - name: Setup Environment Path
        run: |
          echo "$GITHUB_WORKSPACE/toolchain-clang/bin" >> $GITHUB_PATH

      - name: Compile Kernel
        working-directory: kernel-source
        run: |
          chmod -R +x scripts/
          find . -name "*.sh" -exec chmod +x {} +

          # FIX TRACE HEADERS
          if [ -f kernel/sched/walt/trace.h ]; then
            sed -i 's|#define TRACE_INCLUDE_PATH .|#define TRACE_INCLUDE_PATH ../../kernel/sched/walt|g' kernel/sched/walt/trace.h || true
          fi
          if [ -f kernel/sched/trace.h ]; then
            sed -i 's|#define TRACE_INCLUDE_PATH .|#define TRACE_INCLUDE_PATH ../../kernel/sched|g' kernel/sched/trace.h || true
          fi
          if [ -f drivers/hid/hid-trace.h ]; then
            sed -i 's|#define TRACE_INCLUDE_PATH .|#define TRACE_INCLUDE_PATH ../../drivers/hid|g' drivers/hid/hid-trace.h || true
          fi
          for f in drivers/soc/qcom/*trace.h; do
            if [ -f "$f" ]; then
              sed -i 's|#define TRACE_INCLUDE_PATH .|#define TRACE_INCLUDE_PATH ../../drivers/soc/qcom|g' "$f" || true
            fi
          done

          sed -i 's/cc-option -Werror=strict-prototypes//g' Makefile || true
          sed -i 's/-Werror=strict-prototypes//g' Makefile || true

          # BUILD PAKAI nos3_nh_defconfig
          make ARCH=arm64 SUBARCH=arm64 nos3_nh_defconfig
          make ARCH=arm64 SUBARCH=arm64 CC=clang olddefconfig

          make ARCH=arm64 SUBARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=0 \
            -j$(nproc) prepare modules_prepare

          make ARCH=arm64 SUBARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=0 \
            -j$(nproc) Image 2>&1 | tee build.log

          ls -la arch/arm64/boot/

      - name: Download Magiskboot x86_64
        run: |
          wget https://github.com/Uevo001/magiskboot-linux/raw/main/magiskboot -O magiskboot
          chmod +x magiskboot
          file magiskboot
          ./magiskboot --help || echo "Test done"

      - name: Download boot.img Ori
        run: |
          wget "https://github.com/smr646/kernel-nothing-phone-1-custom-config/releases/download/v.1016/boot.img" -O boot.img
          file boot.img
          ls -la boot.img

      - name: Repack boot.img
        run: |
          ./magiskboot unpack boot.img
          cp kernel-source/arch/arm64/boot/Image kernel
          ./magiskboot repack boot.img new-boot.img
          ls -la new-boot.img

      - name: Compress boot.img
        run: |
          gzip -c new-boot.img > new-boot.img.gz
          ls -la new-boot.img.gz

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Log
          path: kernel-source/build.log

      - name: Upload boot.img.gz
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: boot.img.gz
          path: new-boot.img.gz
          if-no-files-found: warn

      - name: Upload Image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Image
          path: kernel-source/arch/arm64/boot/Image
          if-no-files-found: warn
